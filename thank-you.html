<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ava Orbe — You're In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-1: #008080;
    --bg-2: #004c4c;
    --bg-3: #001f1f;
    --card-bg: #ffffff;
    --card-border: #C0CCD9;
    --heading: #ffffff;
    --subhead: #026F6F;
    --body-text: #3C4858;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, var(--bg-1), var(--bg-2) 60%, var(--bg-3) 100%);
    font-family: 'Montserrat', sans-serif;
    color: var(--heading);
    text-align: center;
    overflow-x: hidden;
    padding: 40px 20px;
  }

  .container {
    max-width: 560px;
    width: 100%;
    animation: fadeIn 1.2s ease-out;
  }

  h1.brand {
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 800;
    margin: 0 0 28px 0;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 44px 32px;
    max-width: 540px;
    margin: 0 auto;
  }

  .icon-wrap {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px auto;
    border-radius: 50%;
    background: rgba(0, 128, 128, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-wrap svg {
    width: 30px;
    height: 30px;
  }

  .headline {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--subhead);
    margin: 0 0 14px 0;
    text-align: center;
  }

  .body-copy {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--body-text);
    margin: 0 0 8px 0;
    text-align: center;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>
  <div class="container">
    <h1 class="brand">Ava Orbe</h1>

    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9.5 18L20 6" stroke="#004c4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="headline">You're in ♡</p>
      <p class="body-copy">No songs out yet, no proof of anything.<br>Just me, my melodies, and now... you.</p>
    </div>
  </div>
</body>
</html>
